<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klick nicht den Button!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .button-wrapper {
            margin-bottom: 50px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        button.blinking {
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.35;
            }
        }

        .timer-section {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .timer-section.active {
            opacity: 1;
        }

        .timer-text {
            color: #555;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .timer {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-in;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #764ba2;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .modal-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.6);
        }

        .star-field {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            top: -20px;
            color: #fff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            animation: fall linear infinite;
        }

        @keyframes fall {
            from {
                transform: translateY(0) rotate(0deg);
            }
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .container,
        .modal {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="star-field" id="starField"></div>
    <div class="container">
        <h1>🚫 Klick nicht den Button!</h1>

        <div class="button-wrapper">
            <button id="dangerButton">Klick mich</button>
        </div>

        <div class="timer-section" id="timerSection">
            <div class="timer-text">Du hast den Button für</div>
            <div class="timer" id="timerDisplay">00:00</div>
            <div class="timer-text">nicht gedrückt. Anständig!</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>😱 Oops!</h2>
            <p>Du hast den Button gedrückt. Frech von dir.</p>
            <button class="modal-button" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;
        let buttonClicked = false;

        const button = document.getElementById('dangerButton');
        const modal = document.getElementById('modal');
        const timerSection = document.getElementById('timerSection');
        const timerDisplay = document.getElementById('timerDisplay');

        const GROWTH_INTERVAL_SECONDS = 5;
        const MAX_GROWTH_STAGE = 20;
        const REDDEN_FULL_STAGE = 12;
        const BLINK_START_SECONDS = 60;

        const START_COLOR_1 = [102, 126, 234]; // #667eea
        const START_COLOR_2 = [118, 75, 162];  // #764ba2
        const END_COLOR_1 = [220, 38, 38];      // kräftiges Rot
        const END_COLOR_2 = [153, 27, 27];      // dunkles Rot

        function mixChannel(start, end, t) {
            return Math.round(start + (end - start) * t);
        }

        function mixColor(startRgb, endRgb, t) {
            return `rgb(${mixChannel(startRgb[0], endRgb[0], t)}, ${mixChannel(startRgb[1], endRgb[1], t)}, ${mixChannel(startRgb[2], endRgb[2], t)})`;
        }

        /**
         * Button alle 5 Sekunden größer und röter werden lassen,
         * ab 60 Sekunden zusätzlich blinken lassen
         */
        function updateButtonAppearance(elapsedSeconds) {
            const stage = Math.min(Math.floor(elapsedSeconds / GROWTH_INTERVAL_SECONDS), MAX_GROWTH_STAGE);
            const scale = 1 + stage * 0.08;
            const redness = Math.min(stage / REDDEN_FULL_STAGE, 1);

            button.style.transform = `scale(${scale})`;
            button.style.background = `linear-gradient(135deg, ${mixColor(START_COLOR_1, END_COLOR_1, redness)} 0%, ${mixColor(START_COLOR_2, END_COLOR_2, redness)} 100%)`;

            button.classList.toggle('blinking', elapsedSeconds >= BLINK_START_SECONDS);
        }

        /**
         * Timer starten beim Laden der Seite
         */
        function startTimer() {
            startTime = Date.now();
            timerSection.classList.add('active');

            timerInterval = setInterval(() => {
                if (!buttonClicked) {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    timerDisplay.textContent =
                        String(minutes).padStart(2, '0') + ':' +
                        String(seconds).padStart(2, '0');

                    updateButtonAppearance(elapsed);
                }
            }, 100);
        }

        /**
         * Event Listener: Button Click
         */
        button.addEventListener('click', () => {
            buttonClicked = true;
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            modal.classList.add('show');
        });

        /**
         * Modal schließen
         */
        function closeModal() {
            modal.classList.remove('show');
        }

        /**
         * Modal durch Klick außerhalb schließen
         */
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        /**
         * Sterne-Regen im Hintergrund erzeugen
         */
        const starField = document.getElementById('starField');

        function spawnStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = '⭐';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.fontSize = (10 + Math.random() * 18) + 'px';
            star.style.opacity = 0.5 + Math.random() * 0.5;
            const duration = 4 + Math.random() * 6;
            star.style.animationDuration = duration + 's';
            starField.appendChild(star);
            setTimeout(() => star.remove(), duration * 1000);
        }

        setInterval(spawnStar, 150);

        // Timer beim Laden starten
        startTimer();
    </script>
</body>
</html>
