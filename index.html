<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klick nicht den Button!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .button-wrapper {
            margin-bottom: 50px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        button.blinking {
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.35;
            }
        }

        .timer-section {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .timer-section.active {
            opacity: 1;
        }

        .timer-text {
            color: #555;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .timer {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-in;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #764ba2;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .modal-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.6);
        }

        .restart-button {
            background: transparent;
            color: #888;
            border: 2px solid #ddd;
            padding: 8px 20px;
            font-size: 14px;
            margin-top: 20px;
            box-shadow: none;
        }

        .rain-field {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .raindrop {
            position: absolute;
            top: -60px;
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, rgba(174, 214, 241, 0.85));
            animation: rainfall linear infinite;
        }

        @keyframes rainfall {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-40px, 110vh);
            }
        }

        .butterfly-field {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .butterfly {
            position: absolute;
            bottom: -30px;
            animation: flutter linear infinite;
        }

        @keyframes flutter {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -30vh) rotate(15deg);
            }
            50% {
                transform: translate(-30px, -55vh) rotate(-15deg);
            }
            75% {
                transform: translate(30px, -80vh) rotate(15deg);
            }
            100% {
                transform: translate(-20px, -115vh) rotate(0deg);
            }
        }

        .page,
        .modal {
            position: relative;
            z-index: 1;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .banner-90s {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            box-sizing: border-box;
            background: repeating-linear-gradient(45deg, red, orange, yellow, limegreen, dodgerblue, violet, red);
            background-size: 300% 300%;
            animation: rainbow-shift 3s linear infinite;
            border: 4px double #000;
            text-align: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-weight: 900;
            font-size: 22px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
        }

        .banner-90s span {
            display: inline-block;
            animation: blink-banner 0.6s infinite;
        }

        @keyframes rainbow-shift {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 300% 50%;
            }
        }

        @keyframes blink-banner {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.25;
            }
        }
    </style>
</head>
<body>
    <div class="star-field" id="starField"></div>
    <div class="rain-field" id="rainField"></div>
    <div class="butterfly-field" id="butterflyField"></div>
    <div class="page">
        <div class="banner-90s">🔥<span>Hottest shit! get here</span>🔥</div>
        <div class="container">
            <h1>🚫 Klick nicht den Button!</h1>

            <div class="button-wrapper">
                <button id="dangerButton">Klick mich</button>
            </div>

            <div class="timer-section" id="timerSection">
                <div class="timer-text">Du hast den Button für</div>
                <div class="timer" id="timerDisplay">00:00</div>
                <div class="timer-text">nicht gedrückt. Anständig!</div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>😱 Oops!</h2>
            <p>Du hast den Button gedrückt. Frech von dir.</p>
            <button class="modal-button" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div class="modal" id="restartModal">
        <div class="modal-content">
            <h2>😈 Erwischt!</h2>
            <p>DIESEN BUTTON AUCH NICHT!!!</p>
            <button class="modal-button" onclick="closeRestartModal()">OK</button>
        </div>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;
        let buttonClicked = false;

        const button = document.getElementById('dangerButton');
        const modal = document.getElementById('modal');
        const restartButton = document.getElementById('restartButton');
        const restartModal = document.getElementById('restartModal');
        const timerSection = document.getElementById('timerSection');
        const timerDisplay = document.getElementById('timerDisplay');

        const GROWTH_INTERVAL_SECONDS = 5;
        const MAX_GROWTH_STAGE = 20;
        const REDDEN_FULL_STAGE = 12;
        const BLINK_START_SECONDS = 60;

        const START_COLOR_1 = [102, 126, 234]; // #667eea
        const START_COLOR_2 = [118, 75, 162];  // #764ba2
        const END_COLOR_1 = [220, 38, 38];      // kräftiges Rot
        const END_COLOR_2 = [153, 27, 27];      // dunkles Rot

        function mixChannel(start, end, t) {
            return Math.round(start + (end - start) * t);
        }

        function mixColor(startRgb, endRgb, t) {
            return `rgb(${mixChannel(startRgb[0], endRgb[0], t)}, ${mixChannel(startRgb[1], endRgb[1], t)}, ${mixChannel(startRgb[2], endRgb[2], t)})`;
        }

        /**
         * Button alle 5 Sekunden größer und röter werden lassen,
         * ab 60 Sekunden zusätzlich blinken lassen
         */
        function updateButtonAppearance(elapsedSeconds) {
            const stage = Math.min(Math.floor(elapsedSeconds / GROWTH_INTERVAL_SECONDS), MAX_GROWTH_STAGE);
            const scale = 1 + stage * 0.08;
            const redness = Math.min(stage / REDDEN_FULL_STAGE, 1);

            button.style.transform = `scale(${scale})`;
            button.style.background = `linear-gradient(135deg, ${mixColor(START_COLOR_1, END_COLOR_1, redness)} 0%, ${mixColor(START_COLOR_2, END_COLOR_2, redness)} 100%)`;

            button.classList.toggle('blinking', elapsedSeconds >= BLINK_START_SECONDS);
        }

        /**
         * Timer starten beim Laden der Seite
         */
        function startTimer() {
            startTime = Date.now();
            timerSection.classList.add('active');

            timerInterval = setInterval(() => {
                if (!buttonClicked) {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    timerDisplay.textContent =
                        String(minutes).padStart(2, '0') + ':' +
                        String(seconds).padStart(2, '0');

                    updateButtonAppearance(elapsed);
                }
            }, 100);
        }

        /**
         * Event Listener: Button Click
         */
        button.addEventListener('click', () => {
            buttonClicked = true;
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            modal.classList.add('show');
        });

        /**
         * Modal schließen
         */
        function closeModal() {
            modal.classList.remove('show');
        }

        /**
         * Event Listener: Neustart-Button
         */
        restartButton.addEventListener('click', () => {
            restartModal.classList.add('show');
        });

        /**
         * Spiel zurücksetzen: Timer, Button-Optik und Klick-Status neu initialisieren
         */
        function resetGame() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            buttonClicked = false;
            timerDisplay.textContent = '00:00';
            button.style.transform = '';
            button.style.background = '';
            button.classList.remove('blinking');
            modal.classList.remove('show');
            startTimer();
        }

        /**
         * Neustart-Popup schließen und Spiel neu starten
         */
        function closeRestartModal() {
            restartModal.classList.remove('show');
            resetGame();
        }

        /**
         * Modal durch Klick außerhalb schließen
         */
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
            if (event.target === restartModal) {
                closeRestartModal();
            }
        });

        /**
         * Sterne-Regen im Hintergrund erzeugen
         */
        const starField = document.getElementById('starField');

        function spawnStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = '⭐';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.fontSize = (10 + Math.random() * 18) + 'px';
            star.style.opacity = 0.5 + Math.random() * 0.5;
            const duration = 4 + Math.random() * 6;
            star.style.animationDuration = duration + 's';
            starField.appendChild(star);
            setTimeout(() => star.remove(), duration * 1000);
        }

        setInterval(spawnStar, 150);

        /**
         * Regen im Hintergrund erzeugen
         */
        const rainField = document.getElementById('rainField');

        function spawnRaindrop() {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            drop.style.left = Math.random() * 110 + 'vw';
            drop.style.height = (30 + Math.random() * 40) + 'px';
            drop.style.opacity = 0.4 + Math.random() * 0.5;
            const duration = 0.6 + Math.random() * 0.6;
            drop.style.animationDuration = duration + 's';
            rainField.appendChild(drop);
            setTimeout(() => drop.remove(), duration * 1000);
        }

        setInterval(spawnRaindrop, 40);

        /**
         * Schmetterlinge im Hintergrund erzeugen
         */
        const butterflyField = document.getElementById('butterflyField');

        function spawnButterfly() {
            const butterfly = document.createElement('div');
            butterfly.className = 'butterfly';
            butterfly.textContent = '🦋';
            butterfly.style.left = Math.random() * 100 + 'vw';
            butterfly.style.fontSize = (16 + Math.random() * 16) + 'px';
            const duration = 8 + Math.random() * 6;
            butterfly.style.animationDuration = duration + 's';
            butterflyField.appendChild(butterfly);
            setTimeout(() => butterfly.remove(), duration * 1000);
        }

        setInterval(spawnButterfly, 2000);

        // Timer beim Laden starten
        startTimer();
    </script>
</body>
</html>
